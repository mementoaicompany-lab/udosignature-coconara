name: Publish Coconara brand navigation update
on:
  push:
    paths: ['.github/workflows/install-website.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'mementoaicompany-lab/udosignature-coconara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reviewed website package
        run: |
          python3 - <<'PYCODE'
          import hashlib,zipfile,pathlib,shutil
          p=pathlib.Path('website-package.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'd4ff217394b8038efbb71886cb6a806eb44fa5294a63393c83526753341d76a7'
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  q=pathlib.PurePosixPath(name)
                  assert not q.is_absolute() and '..' not in q.parts
                  assert not any(x in q.parts for x in ['.git','.github','.openai'])
              for name in ['docs','assets','src','scripts','content']:
                  if pathlib.Path(name).exists(): shutil.rmtree(name)
              z.extractall('.')
          p.unlink()
          PYCODE
          python3 build.py
          python3 scripts/check.py
          node scripts/check-ferry.cjs
          for script in assets/*.js; do node --check "$script"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          git commit -m 'Add grouped guide navigation, brand lettering, and desktop shortcuts'
          git push origin HEAD:main
